name: Deploy Convex

# The gap this closes: pushing to main deploys the WEBSITE (Cloudflare Pages)
# but never the Convex backend — `npx convex deploy` was a manual local step,
# so backend fixes could sit on main for days while prod ran stale functions.
# Now any push that touches src/convex/ ships the backend too.
#
# Needs one repo secret: CONVEX_DEPLOY_KEY (Settings → Secrets and variables →
# Actions), a prod deploy key from the Convex dashboard. The key lives ONLY
# there — never in this file, never in the repo.
on:
  push:
    branches: [main]
    paths:
      - "src/convex/**"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

concurrency:
  group: deploy-convex
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy backend to Convex prod
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Deploy
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          if [ -z "$CONVEX_DEPLOY_KEY" ]; then
            echo "::error::CONVEX_DEPLOY_KEY secret is not set — add it in Settings → Secrets and variables → Actions."
            exit 1
          fi
          npx convex deploy --yes
