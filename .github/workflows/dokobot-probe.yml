name: dokobot-probe

# Feasibility probe: can @dokobot/cli local mode produce search results on a
# GitHub Actions runner with zero owner setup? Manual-dispatch only — never
# fires on push/PR. Not wired to the pipeline; safe to leave in the repo.

on:
  workflow_dispatch:

jobs:
  probe:
    name: Dokobot local-mode probe (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOKOBOT_TELEMETRY_DISABLED: "1"
      DOKOBOT_DISABLE_AUTO_UPDATE: "1"
      UA: "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"

    steps:
      - name: "Runner IP and geo (context for Google IP-based response)"
        run: |
          echo "== Runner egress IP =="
          curl -sS https://api.ipify.org || true
          echo
          echo "== Approximate geo =="
          curl -sS "https://ipinfo.io/json" || true
          echo

      - name: "Environment inventory"
        run: |
          set -x
          node --version
          npm --version
          which google-chrome || which google-chrome-stable || echo "no chrome"
          google-chrome --version 2>/dev/null || google-chrome-stable --version 2>/dev/null || true
          which chromedriver || true
          which xvfb-run || true

      - name: "Install @dokobot/cli globally"
        run: |
          npm i -g @dokobot/cli
          which dokobot
          dokobot --version

      - name: "Top-level help"
        run: dokobot --help

      - name: "search subcommand help (does --local exist?)"
        run: dokobot search --help

      - name: "read subcommand help (--local documented here)"
        run: dokobot read --help

      - name: "install-bridge help"
        run: dokobot install-bridge --help

      - name: "Attempt dokobot search with no API key (expected: hard fail)"
        continue-on-error: true
        run: |
          set +e
          dokobot search "godot flight simulator" 2>&1 | tee search-noflag.log
          echo "exit=$?"

      - name: "Attempt dokobot search --local (expected: unknown option)"
        continue-on-error: true
        run: |
          set +e
          dokobot search --local "godot flight simulator" 2>&1 | tee search-local.log
          echo "exit=$?"

      - name: "Attempt dokobot install-bridge --browser chrome (needs extension pairing)"
        continue-on-error: true
        timeout-minutes: 3
        run: |
          set +e
          # Runs unattended; without the Dokobot Chrome extension installed
          # from the Web Store and Chrome actually running, activation should
          # time out. Log whatever it does.
          dokobot install-bridge --browser chrome 2>&1 | tee install-bridge.log
          echo "exit=$?"

      - name: "List bridges after install attempt"
        continue-on-error: true
        run: |
          set +e
          dokobot doko list 2>&1 | tee doko-list.log
          echo "exit=$?"

      - name: "Attempt dokobot read --local on a Google search URL (expected: bridge/extension not connected)"
        continue-on-error: true
        timeout-minutes: 3
        run: |
          set +e
          dokobot read --local "https://www.google.com/search?q=godot+flight+simulator" --timeout 30 2>&1 | tee read-local-google.log
          echo "exit=$?"

      # ------------- CONTROLS: what does Google itself do from Actions IPs -------------

      - name: "Control - curl Google search (measure IP-based blocking)"
        continue-on-error: true
        run: |
          set +e
          echo "== HEAD =="
          curl -sSI -A "$UA" "https://www.google.com/search?q=godot+flight+simulator&hl=en&gl=us" | tee google-head.log
          echo "== BODY =="
          HTTP_CODE=$(curl -sS -o google-body.html -w "%{http_code}" -A "$UA" -L "https://www.google.com/search?q=godot+flight+simulator&hl=en&gl=us")
          echo "http_code=$HTTP_CODE  bytes=$(wc -c < google-body.html)"
          echo "-- head of body --"
          head -c 2000 google-body.html
          echo
          echo "-- classifiers --"
          grep -c -iE "captcha|unusual traffic|verify.*human|/sorry/|consent\.google\.com|Before you continue" google-body.html || true
          grep -c -iE "search|<title>" google-body.html || true
          grep -c -oE "href=\"/url\\?q=" google-body.html || true

      - name: "Control - curl Google /sorry/ redirect check (bot-wall probe)"
        continue-on-error: true
        run: |
          set +e
          curl -sS -o /dev/null -A "$UA" -w "final_url=%{url_effective}\nhttp_code=%{http_code}\nnum_redirects=%{num_redirects}\n" -L \
            "https://www.google.com/search?q=godot+flight+simulator&hl=en&gl=us" | tee google-redirect.log

      - name: "Control - curl DuckDuckGo html"
        continue-on-error: true
        run: |
          set +e
          HTTP_CODE=$(curl -sS -o ddg-body.html -w "%{http_code}" -A "$UA" -L "https://html.duckduckgo.com/html/?q=godot+flight+simulator")
          echo "http_code=$HTTP_CODE  bytes=$(wc -c < ddg-body.html)"
          echo "-- head of body --"
          head -c 2000 ddg-body.html
          echo
          echo "-- classifiers --"
          grep -c -iE "captcha|anomaly|blocked" ddg-body.html || true
          grep -c -oE "class=\"result__a\"" ddg-body.html || true

      - name: "Upload probe artefacts"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dokobot-probe-logs
          path: |
            *.log
            *.html
          if-no-files-found: warn
