name: Convex restore

# Redeploys the Convex backend from any ref, for rolling back a bad deploy. The default
# is the archive tag, the last tree production ran before the rebuild. Dispatch-only:
# nothing here runs on push.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to deploy (tag, branch or commit)"
        required: true
        default: "archive/pre-redo-2026-09"

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      # The archived tree keeps Convex at the repo root; the rebuild keeps it in apps/convex.
      - name: Deploy
        run: |
          if [ -f apps/convex/convex.json ]; then cd apps/convex; fi
          bunx convex deploy --yes --message "restore ${{ inputs.ref }}"
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
