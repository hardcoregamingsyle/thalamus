name: Convex restore

# Restore the NAMELESS Convex backend from an explicit, verified known-good ref.
# This workflow is dispatch-only and never runs automatically.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to deploy (tag, branch or commit)"
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - name: Deploy
        working-directory: apps/convex
        run: bunx convex deploy --yes --message "restore ${{ inputs.ref }}"
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
