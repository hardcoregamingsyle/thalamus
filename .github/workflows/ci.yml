name: CI

# Quality gate on every push/PR to main. Keeps the foundation solid: no change
# lands without the frontend type-checking + linting clean and the desktop app
# compiling. Fast (web job ~1 min); the desktop job catches C# breakage before
# a release tag ever builds it.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web — type-check + lint + test + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # AgentOverflow reaches this backend by string with no codegen, so its 27
      # references are the ones that break silently at runtime. Without this
      # checkout the ref checker cannot see them and would pass regardless.
      - name: Check out agentoverflow (for cross-repo ref checking)
        uses: actions/checkout@v4
        with:
          repository: hardcoregamingsyle/agentoverflow
          path: .agentoverflow
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # Cloudflare Pages deploys with `npm ci`, so package-lock.json must stay in
      # sync with package.json — this fails fast if a `bun add` desynced it.
      - name: Verify npm lockfile in sync
        run: npm ci --dry-run --no-audit --no-fund
      - run: bun install --frozen-lockfile
      - name: Type-check
        run: bun run type-check
      - name: Lint
        run: bun run lint
      # tsc cannot catch a wrong Convex function name — the generated api object
      # exceeds TS instantiation depth and degrades to `any` — and three callers
      # reach the backend by plain string anyway. This is the only gate on them.
      - name: Check Convex references
        run: bun run check-refs
        env:
          AGENTOVERFLOW_DIR: ${{ github.workspace }}/.agentoverflow
      - name: Test
        run: bun test
      # tsc does not see Vite-stage failures (lazy chunk resolution, asset
      # imports, plugin config). Without this the Pages deploy finds them first.
      - name: Build
        run: bun run build

  desktop:
    name: Desktop — dotnet build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build WPF app
        run: dotnet build thalamus-native/ThalamusApp/ThalamusApp.csproj -c Release
