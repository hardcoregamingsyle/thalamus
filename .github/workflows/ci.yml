name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      # Cloudflare Pages installs with `npm ci`, so package-lock.json must match package.json.
      - run: npm ci --dry-run --no-audit --no-fund
      - run: bun install --frozen-lockfile
      - run: bun run type-check
      - run: bun run lint
      - run: bun run format:check
      - run: bun run test
      - run: bun run build

  # Pushes to main deploy the NAMELESS Convex backend. The web app
  # deploys separately through the Cloudflare Pages git integration. Backend
  # deployment must not silently skip while Pages publishes newer auth links. Pull requests,
  # including forks, never reach this job and never see its secrets.
  deploy:
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile

      - name: Require the existing Convex deployment credential
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          if [ -z "$CONVEX_DEPLOY_KEY" ]; then
            echo "::error::Set repository secret CONVEX_DEPLOY_KEY for befitting-wildebeest-866. The backend is stale until this deployment succeeds."
            exit 1
          fi

      - name: Record the production function set before deploying
        working-directory: apps/convex
        run: bunx convex function-spec > "$RUNNER_TEMP/spec-before.json"
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}

      - name: Deploy Convex
        working-directory: apps/convex
        # Retiring the old product indexes is intentional; documents are retained.
        run: bunx convex deploy --yes --allow-deleting-large-indexes --message "${{ github.sha }}"
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}

      - name: Report functions added and removed
        continue-on-error: true
        working-directory: apps/convex
        run: |
          bunx convex function-spec > "$RUNNER_TEMP/spec-after.json"
          node scripts/diff-function-spec.mjs "$RUNNER_TEMP/spec-before.json" "$RUNNER_TEMP/spec-after.json"
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}

      - name: Smoke-test Convex
        run: bash apps/convex/scripts/smoke.sh
