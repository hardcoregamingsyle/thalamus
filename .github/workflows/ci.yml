name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      # Cloudflare Pages installs with `npm ci`, so package-lock.json must match package.json.
      - run: npm ci --dry-run --no-audit --no-fund
      - run: bun install --frozen-lockfile
      - run: bun run type-check
      - run: bun run lint
      - run: bun run format:check
      - run: bun run test
      # The AgentOverflow site calls the shared Convex deployment by string name.
      - uses: actions/checkout@v4
        with:
          repository: hardcoregamingsyle/agentoverflow
          path: .agentoverflow
      - run: bun run --filter=@thalamus/convex check-refs
        env:
          AGENTOVERFLOW_DIR: ${{ github.workspace }}/.agentoverflow
      - run: bun run build
      - run: bun run build:gateway

  # Pushes to main deploy the database, the gateway and Convex from here. The web app
  # deploys separately through the Cloudflare Pages git integration. Pull requests,
  # including forks, never reach this job and never see its secrets.
  deploy:
    needs: check
    if: github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile

      - name: Apply database migrations
        working-directory: packages/db
        run: bunx drizzle-kit migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Deploy the gateway
        working-directory: apps/gateway
        run: bunx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # GitHub secrets are the source of truth for the gateway's secrets; Worker
      # secrets cannot be read back, so they are re-applied on every deploy.
      - name: Sync gateway secrets
        working-directory: apps/gateway
        run: |
          node -e '
            const names = ["DATABASE_URL", "MODEL_SERVER_URL", "MODEL_SERVER_SECRET", "USER_KEY_SECRET", "ADMIN_TOKEN", "ADMIN_EMAILS"];
            const out = {};
            for (const n of names) if (process.env[n]) out[n] = process.env[n];
            require("fs").writeFileSync(process.env.RUNNER_TEMP + "/gateway-secrets.json", JSON.stringify(out));
          '
          bunx wrangler secret bulk "$RUNNER_TEMP/gateway-secrets.json"
          rm "$RUNNER_TEMP/gateway-secrets.json"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_URL: ${{ secrets.GATEWAY_DATABASE_URL }}
          MODEL_SERVER_URL: ${{ secrets.MODEL_SERVER_URL }}
          MODEL_SERVER_SECRET: ${{ secrets.MODEL_SERVER_SECRET }}
          USER_KEY_SECRET: ${{ secrets.USER_KEY_SECRET }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}

      # `convex deploy` replaces the deployment's whole function, route and cron set,
      # so it runs only when apps/convex changed.
      - name: Detect Convex changes
        id: convex
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null || ! git diff --quiet "$BEFORE" HEAD -- apps/convex; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Record the production function set before deploying
        if: steps.convex.outputs.changed == 'true'
        working-directory: apps/convex
        run: bunx convex function-spec > "$RUNNER_TEMP/spec-before.json"
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}

      - name: Deploy Convex
        if: steps.convex.outputs.changed == 'true'
        working-directory: apps/convex
        run: bunx convex deploy --yes --message "${{ github.sha }}"
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}

      - name: Report functions added and removed
        if: steps.convex.outputs.changed == 'true'
        continue-on-error: true
        working-directory: apps/convex
        run: |
          bunx convex function-spec > "$RUNNER_TEMP/spec-after.json"
          node scripts/diff-function-spec.mjs "$RUNNER_TEMP/spec-before.json" "$RUNNER_TEMP/spec-after.json"
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}

      - name: Smoke-test Convex
        if: steps.convex.outputs.changed == 'true'
        run: bash apps/convex/scripts/smoke.sh
