name: Set Analytics IDs

# Writes the GA4 / GTM ids for one site into the analyticsConfig table on the
# production deployment. Exists so the ids can be set without the admin token
# being typed or pasted anywhere: it uses the same CONVEX_DEPLOY_KEY the deploy
# workflow uses, which already has full write access to this deployment, and
# analytics:seedAnalyticsConfig is internal, so that key is the only way in.
#
# Dispatch-only. Nothing here runs on push.
on:
  workflow_dispatch:
    inputs:
      site:
        description: "Which product's row to write"
        required: true
        type: choice
        options: [thalamus, agentoverflow]
      ga4Id:
        description: "GA4 measurement id, G-XXXXXXXXXX (blank clears it)"
        required: false
        type: string
      gtmId:
        description: "GTM container id, GTM-XXXXXXX (blank clears it)"
        required: false
        type: string

concurrency:
  group: set-analytics-ids
  cancel-in-progress: false

jobs:
  seed:
    name: Write ids to Convex
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Seed analyticsConfig
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          SITE: ${{ inputs.site }}
          GA4: ${{ inputs.ga4Id }}
          GTM: ${{ inputs.gtmId }}
        run: |
          if [ -z "$CONVEX_DEPLOY_KEY" ]; then
            echo "::error::CONVEX_DEPLOY_KEY secret is not set."
            exit 1
          fi
          # Blank input means "clear": omit the key so the mutation stores undefined.
          ARGS=$(jq -cn --arg site "$SITE" --arg ga4 "$GA4" --arg gtm "$GTM" \
            '{site:$site}
             + (if $ga4 != "" then {ga4Id:$ga4} else {} end)
             + (if $gtm != "" then {gtmId:$gtm} else {} end)')
          echo "args: $ARGS"
          npx convex run analytics:seedAnalyticsConfig "$ARGS"
      # Read it back through the public query — the same call both frontends make.
      - name: Verify
        env:
          SITE: ${{ inputs.site }}
        run: |
          curl -s -X POST https://befitting-wildebeest-866.convex.cloud/api/query \
            -H "Content-Type: application/json" --max-time 60 \
            -d "{\"path\":\"analytics:getAnalyticsConfig\",\"args\":{\"site\":\"$SITE\"},\"format\":\"json\"}" \
            | tee /tmp/verify.json
          echo
          grep -q '"status":"success"' /tmp/verify.json || { echo "::error::verify query failed"; exit 1; }
