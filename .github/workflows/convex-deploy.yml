name: Convex Deploy

# Deploys the Convex backend (src/convex/*) to production. Runs after CI goes
# green on main, so nothing reaches prod that failed type-check / lint / tests /
# build — plus workflow_dispatch for a manual trigger. The frontend deploys
# separately via Cloudflare Pages' own git integration; this only covers the
# backend.
#
# This is the ONLY Convex deploy workflow. A second one (deploy-convex.yml)
# used to deploy on raw push with no CI gate; it was removed — the smoke test
# it carried lives here now.
#
# Requires one repo secret: CONVEX_DEPLOY_KEY (a prod deploy key from the
# Convex dashboard). The key lives only in Actions secrets, never in the repo.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: convex-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy backend to Convex
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Deploy to Convex
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          if [ -z "$CONVEX_DEPLOY_KEY" ]; then
            echo "::error::CONVEX_DEPLOY_KEY secret is not set — add it in Settings → Secrets and variables → Actions."
            exit 1
          fi
          # Retry on Convex-platform flakes. A deploy has failed here on a bare
          # 502 from api.convex.dev/api/deployment/url_for_key — nothing to do
          # with the pushed code, but it left main deployed-behind until someone
          # re-ran the workflow by hand. Three attempts with backoff; a genuine
          # push rejection (bad module, schema conflict) fails all three and
          # still surfaces, just a minute later.
          for attempt in 1 2 3; do
            if npx convex deploy --yes; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::convex deploy attempt $attempt failed — retrying in $((attempt * 20))s"
              sleep $((attempt * 20))
            fi
          done
          echo "::error::convex deploy failed after 3 attempts."
          exit 1
      # A successful deploy only proves the push landed — this proves the
      # deployed backend actually answers. Calls the public guest action (no
      # secrets involved; the deployment URL already ships inside the desktop
      # exe) and fails the run if the backend errors.
      - name: Smoke test — deployed backend answers
        run: |
          RESP=$(curl -s -X POST https://befitting-wildebeest-866.convex.cloud/api/action \
            -H "Content-Type: application/json" \
            --max-time 180 \
            -d '{"path": "ai:guestSendMessage", "args": {"content": "Reply with the single word OK", "mode": "chat", "history": []}, "format": "json"}')
          echo "$RESP" | head -c 400
          echo
          echo "$RESP" | grep -q '"status":"success"' || { echo "::error::Backend smoke test failed"; exit 1; }
