# Bun configuration
# See: https://bun.sh/docs/runtime/bunfig

[install]
# Install all dependencies including devDependencies
# (production=true would skip devDependencies — vite, typescript, etc.)
production = false

# Caret ranges (Bun default); exact pinning lives in the lockfiles.
exact = false

# CI passes --frozen-lockfile explicitly; locally installs stay flexible.
frozenLockfile = false

# Auto-install peer dependencies.
auto = true

# Concurrent script execution for faster installs.
concurrent = true

# NOTE: no `cache` override. It used to point inside node_modules/.cache,
# which `bun run clean` wipes — so every clean also nuked the package cache
# and forced a full re-download. The default (~/.bun/install/cache) survives.

[install.registry]
url = "https://registry.npmjs.org/"

[test]
coverage = false
